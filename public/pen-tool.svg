<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Drop shadow for visibility on both dark and light backgrounds -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="1" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base collar -->
    <path d="M15 11 L21 17 L22.5 15.5 L16.5 9.5 Z" fill="#000000" />
    
    <!-- White Nib Body with black border -->
    <path d="M 0 0 
             L 11 3 
             L 9 7 
             L 16.5 14.5 
             L 14.5 16.5 
             L 7 9 
             L 3 11 
             Z" 
          fill="#FFFFFF" 
          stroke="#000000" 
          stroke-width="1" 
          stroke-linejoin="round" />

    <!-- Inner divider (metallic grey) -->
    <path d="M 9 7 L 14 12 L 12 14 L 7 9 Z" fill="#D2D2D2" stroke="#000000" stroke-width="0.8" />

    <!-- Nib slit -->
    <line x1="0" y1="0" x2="6" y2="6" stroke="#000000" stroke-width="1" stroke-linecap="round" />

    <!-- Nib breathing hole -->
    <circle cx="6" cy="6" r="1" fill="#000000" />
  </g>
</svg>
